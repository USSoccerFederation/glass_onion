# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  tests:
    strategy: 
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        run: uv run pytest
      - name: Build
        run: uv build
  
  coverage:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        run: uv run pytest --cov=glass_onion --cov-report=html --cov-report=xml
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: '60 80'
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request'
        with:
          hide_and_recreate: true
          hide_classify: "OUTDATED"
          path: code-coverage-results.md

  performance:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Checkout Baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: baseline
      # the base branch gets its own environment (baseline/.venv) from its own uv.lock
      - name: Install Baseline
        if: github.event_name == 'pull_request'
        run: uv sync --locked --all-extras --dev --project baseline
      # run this branch's performance tests in the base branch's environment, so both runs time the same tests. addopts
      # is replaced because this branch's pytest options can need plugins the base branch doesn't install (IE:
      # pytest-xdist). Tests for code the base branch doesn't have yet can't be collected, so they're skipped and show
      # no baseline in the report.
      - name: Run Baseline Performance Tests
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: >-
          uv run --locked --project baseline pytest tests/performance
          -o addopts="--import-mode=importlib -q -p no:cacheprovider"
          --continue-on-collection-errors
          --performance-json=performance-baseline.json
      # run serially so tests don't compete with each other for CPU time
      - name: Run performance tests
        run: uv run pytest tests/performance -n0 --performance-report=performance-report.md --performance-baseline=performance-baseline.json
      # the report is written even if a test fails, so post it in that case too
      - name: Performance Report Summary
        if: ${{ !cancelled() }}
        run: cat performance-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Add Performance PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          # a separate header keeps this comment from replacing the coverage comment
          header: performance
          hide_and_recreate: true
          hide_classify: "OUTDATED"
          path: performance-report.md